schemaVersion: 1.0.0
name: "Node.js local execution"
keywords:
  - Node:
      name: "NodeEcho"
      jsfile: "node-keyword-library.zip"
plans:
  - name: "Node.js plan"
    root:
      testCase:
        children:
          - callKeyword:
              keyword: "NodeEcho"
              inputs:
                - message: "hello from the node agent"
              children:
                - check:
                    expression: "output.echoed.equals('hello from the node agent')"
