---
plans:
  - name: "FieldOrdering"
    root:
      testCase:
        nodeName: "FieldOrdering"
        instrumentNode: true
        children:
          - sequence:
              continueParentNodeExecutionOnError: true
              description: "Description"
              nodeName: "Sequence - Sequence Name"
              instrumentNode: true
              continueOnError: true
              pacing: 5000
              before:
                continueOnError: false
                steps:
                  - echo:
                      text:
                        expression: "Test"
                      nodeName: "Echo - Init"
                      description: "Bla"
                      skipNode: true
                      instrumentNode: true
                      continueParentNodeExecutionOnError: true
              after:
                continueOnError: false
                steps:
                  - echo:
                      nodeName: "Echo - After"
                      text: "After"
              children:
                - callKeyword:
                    nodeName: "Keyword call"
                    description: "Description"
                    keyword: "Keyword"
                    inputs:
                      - parameter: "Test"
                    instrumentNode: true
                    children:
                      - assert:
                          actual: "returnValue"
                          operator: "EQUALS"
                          doNegate: true
                          expected: "1"
                          customErrorMessage: "afda"
                      - switch:
                          nodeName: "Switch - switch"
                          description: "Description"
                          expression: "test"
                          children:
                            - case:
                                value: "Bla"
                            - case:
                                value: "Blub"
                      - for:
                          nodeName: "For - Loop"
                          item: "a"
                          threads: 2
                          userItem: "b"
                          start: 0
                          end: 1
                          inc: 2
                          children:
                            - set:
                                nodeName: "Set - variable"
                                key: "variable"
                                value: "value"
                          globalCounter: "c"
                          maxFailedLoops: 1
                    continueParentNodeExecutionOnError: true
                    remote: false
              skipNode: true
  - name: "Some plan"
    root:
      testCase:
        nodeName: "Some plan"
        description: "This is my plan"
        children:
          - set:
              description: "This is a set"
              instrumentNode: true
              key: "key"
              value: "value"
          - callKeyword:
              description: "calling a keyword"
              keyword: "GroovyKW"
              inputs:
                - key: "value"
              skipNode: true
          - threadGroup:
              nodeName: "ThreadGroup 1"
              description: "desc"
              beforeThread:
                continueOnError: false
                steps:
                  - echo:
                      nodeName: "Echo init thread"
                      description: "init group"
                      text: "init thread"
              afterThread:
                continueOnError: false
                steps:
                  - echo:
                      nodeName: "Echo after thread"
                      description: "after thread"
                      text: "after thread"
              before:
                continueOnError: false
                steps:
                  - echo:
                      nodeName: "Echo init group"
                      description: "init group"
                      text: "init group"
              children:
                - callKeyword:
                    nodeName: "GroovyKW - call me"
                    description: "call in thread group"
                    keyword: "GroovyKW"
                    inputs:
                      - key: "value"
                    routing:
                      - OS: "LINUX"
                    remote: false
              after:
                continueOnError: false
                steps:
                  - echo:
                      nodeName: "Echo after group"
                      description: "after group"
                      text: "after group"
