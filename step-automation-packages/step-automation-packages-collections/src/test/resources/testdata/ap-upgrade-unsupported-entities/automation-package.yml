version: 1.2.0
name: "Upgrade with unsupported entities"
parameters:
  - key: "param"
    value: "value"
schedules:
  - name: "descriptorSchedule"
    cron: "0 15 10 ? * *"
    planName: "Versioned"
alertingRules:
  - name: "descriptorRule"
    description: "Rule of the descriptor"
    eventClass: "ExecutionEndedEvent"
fragments:
  - "schedules.yml"
  - "plans/*.yml"
